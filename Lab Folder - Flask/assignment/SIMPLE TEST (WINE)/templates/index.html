<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Wine Class Prediction</title>
    <style>
      body { font-family: Arial, sans-serif; max-width: 760px; margin: 2rem auto; }
      label { display:block; margin-top:0.75rem }
      input[type="text"] { width:100%; padding:0.5rem }
      .btn { margin-top:1rem; padding:0.6rem 1rem }
    </style>
  </head>
  <body>
    <h1>Wine class prediction</h1>
    <p>Enter values for the most relevant features (selected automatically during training).</p>

    <form method="post">
      {% for f in features %}
        <label for="{{f}}">{{f}} (default: {{ '%.3f'|format(means[f]) }})</label>
        <input type="text" id="{{f}}" name="{{f}}" placeholder="{{ '%.3f'|format(means[f]) }}">
      {% endfor %}

      <button class="btn" type="submit">Predict</button>
    </form>
  </body>
  </html>
