<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Prediction Result</title>
    <style>
      body { font-family: Arial, sans-serif; max-width: 760px; margin: 2rem auto; }
      table { border-collapse: collapse; width:100%; }
      th, td { padding: 0.5rem; border: 1px solid #ddd }
    </style>
  </head>
  <body>
    <h1>Prediction</h1>
    <p><strong>Predicted class:</strong> {{ prediction }}</p>

    {% if probs %}
      <h3>Probabilities</h3>
      <table>
        <tr><th>Class</th><th>Probability</th></tr>
        {% for p in probs %}
          <tr><td>{{ target_names[loop.index0] }}</td><td>{{ '%.3f'|format(p) }}</td></tr>
        {% endfor %}
      </table>
    {% endif %}

    <p><a href="/">Back</a></p>
  </body>
  </html>
