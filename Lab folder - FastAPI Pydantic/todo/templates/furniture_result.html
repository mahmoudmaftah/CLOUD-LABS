<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Furniture prediction result</title>
  </head>
  <body>
    <h1>Furniture prediction result</h1>
    {% if error %}
      <p style="color:red">{{ error }}</p>
    {% else %}
      <p>Predicted price: <strong>{{ prediction }}</strong></p>
      <p>Features used: {{ features }}</p>
    {% endif %}
    <p><a href="/furniture">Back</a> | <a href="/">Home</a></p>
  </body>
</html>
