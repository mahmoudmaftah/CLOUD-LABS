<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Furniture prediction</title>
  </head>
  <body>
    <h1>Furniture prediction</h1>
    <form action="/furniture/predict" method="post">
      <label>Category (string or encoded):</label><br>
      <input name="category" required><br>
      <label>Sellable online (string or encoded):</label><br>
      <input name="sellable_online" required><br>
      <label>Other colors (string or encoded):</label><br>
      <input name="other_colors" required><br>
      <label>Depth (numeric):</label><br>
      <input name="depth" type="number" step="any" required><br>
      <label>Height (numeric):</label><br>
      <input name="height" type="number" step="any" required><br>
      <label>Width (numeric):</label><br>
      <input name="width" type="number" step="any" required><br>
      <button type="submit">Predict</button>
    </form>
    <p>
      Note: If you provide original string categories the app will try to map them using
      the dataset in the repository. If unknown, the most frequent value will be used.
    </p>
    <p><a href="/">Back</a></p>
  </body>
</html>
